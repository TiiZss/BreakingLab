services:
  jvl:
    image: tiizss/jvl-2013:2013
    ports:
      - "127.16.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
  mysql:
    image: tiizss/mysql-5.7:5.7
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: abc
    command: ["--default-authentication-plugin=mysql_native_password"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 3s
      timeout: 5s
      retries: 30
